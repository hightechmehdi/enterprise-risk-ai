name: Drift monitoring

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
    inputs:
      scenario:
        description: "Lot de production simulé à contrôler"
        type: choice
        options: [shock, normal]
        default: shock

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      # Cron : lot normal (sinon un réentraînement serait lancé chaque jour)
      SCENARIO: ${{ inputs.scenario || 'normal' }}

    outputs:
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      drift_share: ${{ steps.drift.outputs.drift_share }}

    steps:
      - uses: actions/checkout@v4

      - name: Print greeting
        run: echo "👋 github Actions de monitoring de drift sur la branche ${{ github.ref_name }}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests du monitoring
        run: pytest tests/test_monitoring.py -q

      - name: Génération des lots de production simulés
        run: python -m src.monitoring.monitor --generate

      - name: Détection de drift
        id: drift
        run: |
          if [ "$SCENARIO" = "normal" ]; then
            BATCH=data/monitoring/prod_batch_2026-09_normal.csv
          else
            BATCH=data/monitoring/prod_batch_2026-10_shock.csv
          fi
          python -m src.monitoring.monitor --current-csv "$BATCH"

      - name: Résumé dans l'onglet Actions
        if: always()
        run: |
          echo "### Drift monitoring (${SCENARIO})" >> "$GITHUB_STEP_SUMMARY"
          echo "- drift détecté : ${{ steps.drift.outputs.drift_detected }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- part de variables en drift : ${{ steps.drift.outputs.drift_share }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- variables en drift : ${{ steps.drift.outputs.drifted_columns }} / 5" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload du rapport Evidently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_number }}
          path: reports/monitoring/
          retention-days: 30

  retrain:
    needs: monitor
    if: needs.monitor.outputs.drift_detected == 'true'
    uses: ./.github/workflows/retraining.yml
    with:
      model_alias: challenger
    secrets: inherit
