on:
  workflow_dispatch:  # and manually from the Actions tab
    inputs:
      model_alias:
        description: "Alias MLflow du modèle entraîné"
        type: choice
        options: [champion, challenger]
        default: challenger
  workflow_call:      # appelé par monitoring.yml quand un drift est détecté
    inputs:
      model_alias:
        type: string
        default: challenger


jobs:
  re-training:          # name of the job
    runs-on: ubuntu-latest   # GitHub provides an Ubuntu VM

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
      EXPERIMENT_NAME: ${{ secrets.EXPERIMENT_NAME }}
      PYTHONPATH: ${{ github.workspace }}
      MODEL_ALIAS: ${{ inputs.model_alias || 'challenger' }}


    steps:
      - uses: actions/checkout@v4

      - name: Print greeting
        run: echo "👋 github Actions de re-entrainement sur la branche ${{ github.ref_name }} "
  
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: training
        run: | 
          python src/training/train.py